# KhidmatConnect AI — nginx reverse proxy (production)
#
# Install:  sudo cp deploy/nginx/khidmatconnect.conf /etc/nginx/sites-available/khidmatconnect
# Enable:   sudo ln -s /etc/nginx/sites-available/khidmatconnect /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx
#
# Replace demo.example.org with your actual domain (or _ to match any host
# while no domain is set). HTTP is kept as a redirect target for Certbot and
# for Twilio webhook compatibility; HTTPS is the real entry point.

# HTTP → HTTPS (Certbot temporarily needs plain HTTP for ACME challenges,
# which certbot's --nginx mode handles before this redirect is active).
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.org;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.example.org;

    ssl_certificate     /etc/letsencrypt/live/demo.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Twilio fetches recorded audio; generated TTS audio can be a few MB.
    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Gzip text payloads (maps JS, JSON polling responses)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js needs Upgrade/Connection passthrough (HMR is dev-only,
        # but keep it correct for any long-lived connections).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Twilio webhooks occasionally take a while (TTS + ASR round trips).
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Serve generated audio without buffering delays
        proxy_buffering off;
    }
}

# WebSocket-less app, but nginx needs this map for the Connection header.
# Place in http context if not already present (Debian's nginx.conf includes
# /etc/nginx/conf.d/*.conf before sites-enabled, so a conf.d copy works too).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
